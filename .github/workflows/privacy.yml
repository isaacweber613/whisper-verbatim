name: Publish privacy policy

on:
  push:
    branches: [main]
    paths:
      - docs/privacy.html
      - docs/style.css
      - .github/workflows/privacy.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: privacy-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Prepare policy
        run: |
          mkdir _site
          cp docs/privacy.html docs/style.css _site/
          cp docs/privacy.html _site/index.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
